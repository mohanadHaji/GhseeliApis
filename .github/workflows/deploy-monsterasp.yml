name: Deploy to MonsterASP.NET

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monsterasp-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: windows-latest
    environment: Main

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore API
        run: dotnet restore GhseeliApis/GhseeliApis/GhseeliApis.csproj --runtime win-x64

      - name: Build API
        run: dotnet build GhseeliApis/GhseeliApis/GhseeliApis.csproj --configuration Release --no-restore

      - name: Publish API
        run: >
          dotnet publish GhseeliApis/GhseeliApis/GhseeliApis.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output "${{ github.workspace }}\publish"
          /p:PublishTrimmed=false
          /p:PublishSingleFile=false
          /p:DebugType=None
          /p:DebugSymbols=false

      - name: Retain deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: monsterasp-${{ github.sha }}
          path: publish
          retention-days: 14
          if-no-files-found: error

      - name: Validate deployment secrets
        shell: pwsh
        env:
          DEPLOY_URL: ${{ secrets.MONSTER_WEBDEPLOY_URL }}
          DEPLOY_USERNAME: ${{ secrets.MONSTER_WEBDEPLOY_USERNAME }}
          DEPLOY_PASSWORD: ${{ secrets.MONSTER_WEBDEPLOY_PASSWORD }}
          APP_CONNECTION_STRING: ${{ secrets.APP_CONNECTION_STRING }}
          APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:DEPLOY_URL)) { $missing += "MONSTER_WEBDEPLOY_URL" }
          if ([string]::IsNullOrWhiteSpace($env:DEPLOY_USERNAME)) { $missing += "MONSTER_WEBDEPLOY_USERNAME" }
          if ([string]::IsNullOrWhiteSpace($env:DEPLOY_PASSWORD)) { $missing += "MONSTER_WEBDEPLOY_PASSWORD" }
          if ([string]::IsNullOrWhiteSpace($env:APP_CONNECTION_STRING)) { $missing += "APP_CONNECTION_STRING" }
          if ([string]::IsNullOrWhiteSpace($env:APP_JWT_SECRET)) { $missing += "APP_JWT_SECRET" }

          if ($missing.Count -gt 0) {
              throw "Missing secrets in GitHub environment 'Main': $($missing -join ', ')"
          }

      - name: Inject runtime configuration
        shell: pwsh
        env:
          APP_CONNECTION_STRING: ${{ secrets.APP_CONNECTION_STRING }}
          APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
        run: |
          $webConfigPath = "${{ github.workspace }}\publish\web.config"
          [xml]$webConfig = Get-Content -LiteralPath $webConfigPath -Raw
          $aspNetCore = $webConfig.SelectSingleNode("//aspNetCore")

          if ($null -eq $aspNetCore) {
              throw "The published web.config does not contain an aspNetCore element."
          }

          $aspNetCore.SetAttribute("stdoutLogEnabled", "true")
          $aspNetCore.SetAttribute("stdoutLogFile", ".\logs\stdout")

          $environmentVariables = $aspNetCore.SelectSingleNode("environmentVariables")
          if ($null -eq $environmentVariables) {
              $environmentVariables = $webConfig.CreateElement("environmentVariables")
              [void]$aspNetCore.AppendChild($environmentVariables)
          }

          $values = [ordered]@{
              "ASPNETCORE_ENVIRONMENT" = "Production"
              "ConnectionStrings__DefaultConnection" = $env:APP_CONNECTION_STRING
              "JwtSettings__SecretKey" = $env:APP_JWT_SECRET
              "JwtSettings__Issuer" = "GhseeliApis"
              "JwtSettings__Audience" = "GhseeliApis"
              "JwtSettings__ExpirationMinutes" = "60"
          }

          foreach ($entry in $values.GetEnumerator()) {
              $node = $environmentVariables.SelectSingleNode("environmentVariable[@name='$($entry.Key)']")
              if ($null -eq $node) {
                  $node = $webConfig.CreateElement("environmentVariable")
                  $node.SetAttribute("name", $entry.Key)
                  [void]$environmentVariables.AppendChild($node)
              }
              $node.SetAttribute("value", $entry.Value)
          }

          $settings = [System.Xml.XmlWriterSettings]::new()
          $settings.Indent = $true
          $settings.Encoding = [System.Text.UTF8Encoding]::new($false)
          $writer = [System.Xml.XmlWriter]::Create($webConfigPath, $settings)
          try {
              $webConfig.Save($writer)
          }
          finally {
              $writer.Dispose()
          }

          $logsPath = "${{ github.workspace }}\publish\logs"
          New-Item -ItemType Directory -Path $logsPath -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $logsPath ".keep") -Value "Startup diagnostics directory"

      - name: Install Web Deploy
        shell: pwsh
        run: |
          $path = "${env:ProgramFiles(x86)}\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          if (-not (Test-Path $path)) {
              choco install webdeploy --yes --no-progress
          }
          if (-not (Test-Path $path)) {
              throw "msdeploy.exe was not found after installation."
          }

      - name: Deploy with Web Deploy
        shell: pwsh
        env:
          DEPLOY_URL: ${{ secrets.MONSTER_WEBDEPLOY_URL }}
          DEPLOY_USERNAME: ${{ secrets.MONSTER_WEBDEPLOY_USERNAME }}
          DEPLOY_PASSWORD: ${{ secrets.MONSTER_WEBDEPLOY_PASSWORD }}
        run: |
          $msdeploy = "${env:ProgramFiles(x86)}\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          $source = "${{ github.workspace }}\publish"
          $destination = "contentPath='$env:DEPLOY_USERNAME',computerName='$env:DEPLOY_URL',userName='$env:DEPLOY_USERNAME',password='$env:DEPLOY_PASSWORD',authType='Basic',includeAcls='False'"

          & $msdeploy `
              -verb:sync `
              "-source:contentPath='$source'" `
              "-dest:$destination" `
              -enableRule:AppOffline `
              -allowUntrusted `
              -disableLink:AppPoolExtension `
              -disableLink:ContentExtension `
              -disableLink:CertificateExtension

          if ($LASTEXITCODE -ne 0) {
              throw "Web Deploy failed with exit code $LASTEXITCODE."
          }

      - name: Verify API health
        shell: pwsh
        run: |
          $healthUrl = "${{ vars.MONSTER_SITE_URL }}".TrimEnd('/') + "/api/health"
          if ([string]::IsNullOrWhiteSpace("${{ vars.MONSTER_SITE_URL }}")) {
              throw "Missing MONSTER_SITE_URL variable in GitHub environment 'Main'."
          }

          $attempts = 12

          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
              try {
                  $response = Invoke-WebRequest -Uri $healthUrl -UseBasicParsing -TimeoutSec 20
                  if ($response.StatusCode -eq 200) {
                      Write-Host "Health check passed: $healthUrl"
                      exit 0
                  }
              }
              catch {
                  Write-Host "Health check attempt $attempt/$attempts failed: $($_.Exception.Message)"
                  if (-not [string]::IsNullOrWhiteSpace($_.ErrorDetails.Message)) {
                      Write-Host "Response: $($_.ErrorDetails.Message)"
                  }
              }

              Start-Sleep -Seconds 10
          }

          throw "Deployment completed, but health check did not pass: $healthUrl"

      - name: Download startup diagnostics
        if: failure()
        shell: pwsh
        env:
          DEPLOY_URL: ${{ secrets.MONSTER_WEBDEPLOY_URL }}
          DEPLOY_USERNAME: ${{ secrets.MONSTER_WEBDEPLOY_USERNAME }}
          DEPLOY_PASSWORD: ${{ secrets.MONSTER_WEBDEPLOY_PASSWORD }}
        run: |
          $msdeploy = "${env:ProgramFiles(x86)}\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          $destination = "${{ github.workspace }}\monster-logs"
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          $source = "contentPath='$env:DEPLOY_USERNAME/logs',computerName='$env:DEPLOY_URL',userName='$env:DEPLOY_USERNAME',password='$env:DEPLOY_PASSWORD',authType='Basic'"

          & $msdeploy `
              -verb:sync `
              "-source:$source" `
              "-dest:contentPath='$destination'" `
              -allowUntrusted

          if ($LASTEXITCODE -ne 0) {
              Write-Warning "Unable to download MonsterASP.NET startup logs."
          }

      - name: Upload startup diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: monsterasp-startup-logs-${{ github.run_id }}
          path: monster-logs
          retention-days: 3
          if-no-files-found: warn
